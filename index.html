<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Oxc 工具链演示工作台：Oxlint、Oxfmt、Parser、Transformer、Minifier、Resolver。" />
    <script>
      // Apply the saved preference before styles load to avoid a light/dark flash.
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('oxc-demo-theme');
          if (saved === 'light' || saved === 'dark') mode = saved;
        } catch (_) {}
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute(
          'content',
          dark ? '#151816' : '#f7f8f6'
        );
      })();
    </script>
    <title>Oxc Demo — 工具链工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
